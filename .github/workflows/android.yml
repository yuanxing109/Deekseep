name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Reinstall android-35 platform
      run: |
        set -e
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
        if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"; fi
        echo "sdkmanager = $SDKMANAGER"
        yes | "$SDKMANAGER" --uninstall "platforms;android-35" || true
        yes | "$SDKMANAGER" "platforms;android-35"
        ls -la "$SDK_ROOT/platforms/android-35/" | head

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build
